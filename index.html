<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің сүйіктіме ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 1.5rem;
            max-width: 600px;
            padding: 0 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .heart {
            font-size: 5rem;
            animation: beat 1s infinite alternate;
            cursor: pointer;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="heart">❤️</div>
    <h1>Мен үшін ерекше жанға!</h1>
    <p>Бұл сайт тек сен үшін жасалды. Әрбір сәтім сенімен әдемі, жаным! Сені қатты жақсы көремін! 🥰</p>

</body>
</html>
