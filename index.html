<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Менің ханшайымыма ❤️</title>
    <style>
        body { background: #ffdee9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        h1 { color: #ff477e; text-align: center; }
        .emoji { font-size: 5rem; position: absolute; animation: float 4s linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Сен менің өмірімдегі ең тәтті жансың! 🧸❤️</h1>
    <script>
        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            emoji.innerText = Math.random() > 0.5 ? '🧸' : '❤️';
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
        }
        setInterval(createEmoji, 500);
    </script>
</body>
</html>
